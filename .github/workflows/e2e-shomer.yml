name: Shomer Team end-to-end
on:
  push:
    branches: [shomer-e2e]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: gradle/actions/setup-gradle@v5
      - name: Fake Firebase config for the emulator build
        run: |
          cat > app/google-services.json <<'JSON'
          {"project_info":{"project_number":"1234567890","project_id":"demo-shomer","storage_bucket":"demo-shomer.appspot.com"},
           "client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:0123456789abcdef","android_client_info":{"package_name":"com.shomer.bodycam"}},
           "oauth_client":[],"api_key":[{"current_key":"AIzaSyFakeKeyForTheEmulatorOnly000000000"}],
           "services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}
          JSON
      - name: Build (emulator backend)
        run: chmod +x gradlew && ./gradlew assembleRelease -Psmoke -Pemulator --no-daemon && cp app/build/outputs/apk/release/app-release.apk app.apk
      - name: Install test tools
        run: |
          cd e2e && npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Start Firebase emulators + dashboard
        run: |
          cd backend && nohup ../e2e/node_modules/.bin/firebase emulators:start --only auth,firestore,storage --project demo-shomer > ../emulators.log 2>&1 &
          cd dashboard && nohup python3 -m http.server 8000 > ../http.log 2>&1 &
          for i in $(seq 1 60); do curl -s http://127.0.0.1:8080 >/dev/null && curl -s http://127.0.0.1:9099 >/dev/null && curl -s http://127.0.0.1:9199 >/dev/null && break; sleep 2; done
          curl -s -o /dev/null -w "firestore %{http_code}\n" http://127.0.0.1:8080
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back emulated -camera-front emulated
          script: bash scripts/e2e.sh
      - name: Publish results
        if: always()
        run: |
          mkdir -p results && cp emulators.log results/ 2>/dev/null || true
          cd results
          git init -q -b shomer-e2e-results
          git config user.name github-actions; git config user.email actions@github.com
          git add -A && git commit -qm "e2e ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:shomer-e2e-results
