name: Build Shomer APK
on:
  push:
    branches: [shomer]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rules:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --no-audit --no-fund
      - name: Firestore rules tests (emulator)
        run: |
          set -o pipefail
          npm test 2>&1 | tee rules.log
      - name: Cloud Functions (install, load, unit tests)
        working-directory: backend/functions
        run: |
          npm install --no-audit --no-fund
          node --test plan.test.js
          GCLOUD_PROJECT=demo-shomer node -e "import('./index.js').then(m => console.log('exports:', Object.keys(m).join(', ')))"
      - name: Summary
        if: always()
        run: |
          echo "::notice::rules tests: $(grep -E '^# (tests|pass|fail)' rules.log | tr '\n' ' ')"
          grep -E -A14 "^not ok|^# Subtest|✖" rules.log | grep -E "not ok|error:|message|code:|expected|actual|at .*test\.js" | head -40 | while IFS= read -r l; do echo "::error::$l"; done
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          set -o pipefail
          ./gradlew testDebugUnitTest bundleRelease --no-daemon 2>&1 | tee build.log
          ./gradlew assembleRelease -Parm64Only --no-daemon 2>&1 | tee -a build.log
      - name: Report compile errors as annotations
        if: failure()
        run: |
          grep -E "FAILED$|AssertionError|expected:|^e: |error:|What went wrong|AAPT|Execution failed|Could not resolve|Unresolved" build.log | grep -v "^> Task" | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' > errs.txt || true
          split -l 8 errs.txt chunk_ || true
          for f in $(ls chunk_* 2>/dev/null | head -10); do
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' "$f")
            echo "::error::$msg"
          done
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports
          if-no-files-found: ignore
      - name: Publish APK to apk-shomer branch
        if: success()
        run: |
          mkdir out && cp app/build/outputs/apk/release/app-release.apk out/Shomer.apk && cp app/build/outputs/bundle/release/app-release.aab out/Shomer.aab
          cd out
          git init -q -b apk-shomer
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add Shomer.apk Shomer.aab && git commit -qm "Shomer APK from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:apk-shomer
