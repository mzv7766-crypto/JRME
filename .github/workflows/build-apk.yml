name: Build Jeremy APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Build APK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log
      - name: Report compile errors as annotations
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Could not|FAILURE|> " build.log | head -60 | while IFS= read -r line; do
            echo "::error::${line//$'\n'/ }"
          done
      - name: Publish APK to apk-build branch
        if: success()
        run: |
          mkdir out && cp app/build/outputs/apk/debug/app-debug.apk out/Jeremy.apk
          cd out
          git init -q -b apk-build
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add Jeremy.apk && git commit -qm "APK from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk-build
      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest app/build/outputs/apk/debug/app-debug.apk#Jeremy.apk -t "Jeremy (latest build)" -n "Built from ${GITHUB_SHA::7}" --latest
