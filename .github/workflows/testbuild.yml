name: Build Jeremy TEST (side-by-side)
on:
  push:
    branches: [testbuild-run]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v5
      - name: Download AI model
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL --retry 3 -o app/src/main/assets/efficientdet_lite0.tflite https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/int8/1/efficientdet_lite0.tflite
      - name: Build TEST APK (separate app id, signed with CI key)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease -Parm64Only -Ptestbuild --no-daemon 2>&1 | tee build.log
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner sign --ks app/keys/ci-debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android \
            --out app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/app-release-unsigned.apk
          $BT/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk | head -3
      - name: Report compile errors
        if: failure()
        run: |
          grep -E "FAILED$|^e: |error:|What went wrong|Unresolved|Execution failed|No matching client" build.log | grep -v "^> Task" | head -40 > errs.txt || true
          while IFS= read -r line; do echo "::error::$line"; done < errs.txt || true
      - name: Publish TEST APK
        if: success()
        run: |
          mkdir out && cp app/build/outputs/apk/release/app-release.apk out/JeremyTEST.apk
          cd out
          git init -q -b testbuild-build
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add JeremyTEST.apk && git commit -qm "TEST APK from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:testbuild-build
